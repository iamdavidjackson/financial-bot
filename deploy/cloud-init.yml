package_update: true
packages:
  - git
  - ufw

swap:
  filename: /swapfile
  size: 4G

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - git clone https://github.com/iamdavidjackson/financial-bot.git /opt/financial-bot
  - echo "DOMAIN=:80" > /opt/financial-bot/.env
  - cd /opt/financial-bot && docker compose up -d --build
